name: collect

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC clock, runs 24h so nothing slips past midnight)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "One-time catch-up: also load this many past days (0 = normal run)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect and push to Google Sheet
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python collector/collect.py

      - name: Keep samples of unseen filing formats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples
          path: samples/
          if-no-files-found: ignore

      - name: Save state (also keeps the repo active so the schedule never auto-disables)
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase --autostash origin main || git pull --rebase origin main
          git push
