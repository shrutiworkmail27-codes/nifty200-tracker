<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<base target="_blank">
<title>Nifty 200 Earnings &amp; Concalls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #f4f6fb; --surface: #ffffff; --ink: #0f1b3d; --ink2: #4a5675; --ink3: #7d88a3;
    --line: #e3e8f2; --line2: #eef1f8;
    --brand: #3b4cff; --brand-d: #2a37d6; --brand-t: #eaedff;
    --violet: #7c3aed; --violet-t: #f1eaff; --teal: #0d9488; --teal-t: #d9f3f1;
    --amber: #f59e0b; --amber-t: #fff3d6; --amber-d: #8a5200;
    --live: #ef4444; --green: #12a150; --green-t: #e2f6ea; --green-d: #0b6b38;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(15,27,61,.04), 0 6px 20px rgba(15,27,61,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  .muted { color: var(--ink3); }
  svg { flex: none; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { display: flex; align-items: center; gap: 14px; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 18px var(--display); letter-spacing: -0.01em; white-space: nowrap; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--violet)); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(59,76,255,.35); }
  .nav { display: flex; gap: 2px; margin-left: 14px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { appearance: none; border: 0; background: none; cursor: pointer; padding: 8px 14px; border-radius: 10px; font-weight: 600; color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .nav button:hover { background: var(--line2); }
  .nav button[aria-current="page"] { background: var(--brand-t); color: var(--brand-d); }
  .nb { font-size: 11px; font-weight: 700; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: #fff; display: inline-grid; place-items: center; }
  .nb.amber { background: var(--amber); color: #3b2600; }
  .topr { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .fresh { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); background: var(--green-t); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .fresh i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(18,161,80,.5); animation: pulse 2.4s infinite; }
  .fresh.none { background: var(--line2); } .fresh.none i { background: var(--ink3); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(18,161,80,0); } 100% { box-shadow: 0 0 0 0 rgba(18,161,80,0); } }
  @media (max-width: 1500px) and (min-width: 861px) { .fresh { display: none; } }
  @media (max-width: 1200px) and (min-width: 861px) { .nav button { padding: 8px 9px; } .nav { margin-left: 4px; } }

  /* ---------- buttons ---------- */
  .btn { font-size: 13.5px; font-weight: 600; text-decoration: none; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; line-height: 1.2; }
  .btn:hover { border-color: #b8c3e6; background: #f8f9ff; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(59,76,255,.28); }
  .btn.primary:hover { background: var(--brand-d); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }

  /* ---------- title bar ---------- */
  .titlebar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .tb-in { display: flex; align-items: center; gap: 14px 18px; padding: 18px 24px; flex-wrap: wrap; }
  h1 { font: 800 27px/1.1 var(--display); letter-spacing: -0.025em; margin: 0; }
  .tb-sub { font-size: 13.5px; color: var(--ink3); margin-top: 3px; }
  .tb-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button { appearance: none; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--ink2); padding: 6px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-d); box-shadow: 0 1px 3px rgba(15,27,61,.12); }
  input[type=date], input[type=search], input[type=email] { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  input[type=date] { padding: 6px 9px; font-size: 13px; }
  .dr { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink3); }
  .search { position: relative; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink3); pointer-events: none; }
  .search input { padding-left: 34px; width: 250px; }
  .filt-btn { display: none; }

  /* ---------- layout ---------- */
  .shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 28px; padding-top: 22px; padding-bottom: 40px; align-items: start; }
  .shell.no-side { grid-template-columns: minmax(0, 1fr); }
  .shell.no-side .side { display: none; }
  .side { position: sticky; top: 80px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
  .sd-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .sd-head b { font: 800 15px var(--display); }
  .link { appearance: none; border: 0; background: none; color: var(--brand-d); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .link:hover { text-decoration: underline; }
  .sec { padding: 14px 0; border-top: 1px solid var(--line); }
  .sec:first-of-type { border-top: 0; }
  .sec h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
  .ck { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; font-size: 14px; }
  .ck input { position: absolute; opacity: 0; pointer-events: none; }
  .ck .box { width: 18px; height: 18px; border-radius: 6px; border: 1.6px solid #b9c2d8; background: #fff; display: grid; place-items: center; flex: none; transition: .12s; }
  .ck.radio .box { border-radius: 50%; }
  .ck input:checked + .box { background: var(--brand); border-color: var(--brand); }
  .ck input:checked + .box::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .ck.radio input:checked + .box::after { width: 6px; height: 6px; border: 0; border-radius: 50%; background: #fff; transform: none; }
  .ck input:focus-visible + .box { outline: 3px solid var(--brand); outline-offset: 2px; }
  .ck .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ck .n { font-size: 12px; color: var(--ink3); }
  .ck .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--s); flex: none; }

  /* ---------- cards / banner ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .pad { padding: 20px; }
  .banner { display: flex; align-items: center; gap: 18px 22px; padding: 18px 22px; margin-bottom: 18px; border-radius: 16px; border: 1px solid #dfe3ff; background: linear-gradient(115deg, #eef1ff 0%, #f5efff 55%, #fff1f6 100%); flex-wrap: wrap; }
  .bn-ic { width: 46px; height: 46px; border-radius: 14px; background: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(59,76,255,.18); color: var(--brand); }
  .bn-t { flex: 1 1 220px; min-width: 0; }
  .bn-t b { display: block; font: 800 18px var(--display); letter-spacing: -.01em; }
  .bn-t span { color: var(--ink2); font-size: 13.5px; }
  .subf { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .subf input[type=email] { width: 250px; max-width: 100%; }
  .sub-msg { flex-basis: 100%; font-size: 13px; padding: 7px 11px; border-radius: 10px; }
  .sub-msg.ok { background: var(--green-t); color: var(--green-d); }
  .sub-msg.err { background: #fde8e8; color: #9b1c1c; }
  .sub-msg.busy { background: var(--line2); color: var(--ink2); }
  .tiny { font-size: 12px; color: var(--ink3); }

  /* ---------- overview ---------- */
  .hero { padding: 24px 26px; margin-bottom: 18px; position: relative; overflow: hidden; background: linear-gradient(120deg, #ffffff 0%, #f6f4ff 100%); }
  .hero::after { content: ""; position: absolute; right: -60px; top: -70px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(124,58,237,.16), rgba(59,76,255,.05) 60%, transparent 70%); pointer-events: none; }
  .hd { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hd-big { font: 800 clamp(34px, 6vw, 58px)/1 var(--display); letter-spacing: -0.035em; }
  .hd-rel { font-size: 14px; font-weight: 700; color: var(--brand-d); background: var(--brand-t); padding: 4px 11px; border-radius: 999px; }
  .hd-sum { margin: 8px 0 0; font-size: 17px; color: var(--ink2); }
  .hd-sum b { color: var(--ink); }
  .next { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid #dfe3ff; position: relative; z-index: 1; }
  .next:empty { display: none; }
  .next .lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
  .next .nm { font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tile { padding: 14px 16px; position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .tile .v { font: 800 32px/1.05 var(--display); letter-spacing: -.03em; }
  .tile .k { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .tile .s { font-size: 12px; color: var(--ink3); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 18px; }
  .wd { appearance: none; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
  .wd:hover { border-color: #b8c3e6; }
  .wd[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-t); }
  .wd .w { font-size: 12px; color: var(--ink3); font-weight: 600; }
  .wd .d { font: 800 22px/1.1 var(--display); letter-spacing: -.02em; }
  .wd .c { display: flex; gap: 8px; font-size: 12px; margin-top: 4px; min-height: 18px; color: var(--ink2); }
  .wd .c span { display: inline-flex; align-items: center; gap: 4px; }
  .wd .c i { width: 8px; height: 8px; border-radius: 50%; }
  .wd.is-today .w { color: var(--brand-d); }
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
  .ov-side { display: grid; gap: 18px; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .card-h h3 { margin: 0; font: 800 17px var(--display); letter-spacing: -.01em; }
  .bars { display: grid; gap: 10px; }
  .bar .t { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar .tr { height: 8px; border-radius: 99px; background: var(--line2); overflow: hidden; }
  .bar .tr i { display: block; height: 100%; border-radius: 99px; background: var(--s); width: 0; transition: width .7s cubic-bezier(.2,.7,.2,1); }
  .side-sub { display: grid; gap: 12px; }
  .side-sub .subf { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .side-sub .subf input[type=email] { width: 100%; }

  /* ---------- timeline ---------- */
  .tl-wrap { margin-bottom: 14px; }
  .tl { overflow-x: auto; padding: 2px 2px 8px; }
  .tl-in { position: relative; min-width: 980px; }
  .tl-hours { position: relative; height: 22px; font-size: 11.5px; color: var(--ink3); }
  .tl-hours span { position: absolute; transform: translateX(-50%); }
  .tl-track { position: relative; margin-top: 2px; border-radius: 12px; background: #fafbfe; border: 1px solid var(--line2); }
  .tl-mkt { position: absolute; top: 0; bottom: 0; background: #eef1ff; border-radius: 11px; }
  .tl-mkt em { position: absolute; left: 10px; bottom: 5px; font-style: normal; font-size: 10.5px; color: #8b97d8; font-weight: 700; letter-spacing: .04em; }
  .tl-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line2); }
  .blk { position: absolute; height: 42px; border-radius: 9px; background: var(--st); border-left: 4px solid var(--s); color: var(--sd); padding: 3px 7px; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-decoration: none; display: block; transform-origin: left center; }
  .blk b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk small { font-size: 11px; opacity: .85; }
  a.blk:hover { filter: brightness(.97); box-shadow: 0 3px 10px rgba(15,27,61,.14); }
  .blk.past { opacity: .5; }
  .blk.live { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--live); }
  .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--live); z-index: 3; }
  .now span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background: var(--live); color: #fff; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
  .tl-extra { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--ink2); }
  .pillsym { padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 12.5px; background: var(--st); color: var(--sd); }
  .tl.anim .blk { animation: grow .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes grow { from { opacity: 0; transform: scaleX(.15); } }

  /* ---------- agenda rows ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 6px 4px 11px; border-radius: 999px; background: var(--brand-t); color: var(--brand-d); border: 0; cursor: pointer; }
  .fchip b { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-size: 13px; line-height: 1; }
  .dayh { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 9px; flex-wrap: wrap; }
  .dayh:first-child { margin-top: 4px; }
  .dayh h3 { margin: 0; font: 800 21px var(--display); letter-spacing: -0.02em; }
  .dayh span { color: var(--ink3); font-size: 13.5px; }
  .dayh .t { color: var(--brand-d); font-weight: 700; }
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 16px 14px 22px; border-top: 1px solid var(--line2); }
  .row:first-child { border-top: 0; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--s); }
  .row:hover { background: #fafbff; }
  .r-time b { display: block; font: 800 20px/1.1 var(--display); letter-spacing: -0.02em; }
  .r-time small { color: var(--ink3); font-size: 12px; }
  .cd { display: inline-block; margin-top: 3px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .cd.soon { background: var(--brand-t); color: var(--brand-d); }
  .cd.hot { background: var(--amber-t); color: var(--amber-d); }
  .cd.live { background: var(--live); color: #fff; }
  .cd.done { background: var(--line2); color: var(--ink3); }
  .r-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--st); color: var(--sd); flex: none; }
  .sym { font: 800 17px var(--display); letter-spacing: -0.01em; }
  .nm2 { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
  .r-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0 0 44px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--line2); color: var(--ink2); }
  .tag.call { background: var(--brand-t); color: var(--brand-d); }
  .tag.res { background: var(--amber-t); color: var(--amber-d); }
  .tag.sec { background: var(--st); color: var(--sd); }
  .tag.post { background: var(--green-t); color: var(--green-d); }
  .tag.g1 { background: var(--brand-t); color: var(--brand-d); } .tag.g2 { background: var(--violet-t); color: #5b21b6; } .tag.g3 { background: var(--teal-t); color: #0b5f58; }
  .r-act { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
  .nolink { font-size: 12.5px; color: var(--amber-d); background: var(--amber-t); padding: 4px 10px; border-radius: 8px; max-width: 260px; }
  .star { appearance: none; border: 0; background: none; cursor: pointer; padding: 2px; color: #c3cada; display: inline-grid; place-items: center; border-radius: 6px; }
  .star:hover { color: var(--amber); }
  .star.on { color: var(--amber); }
  .empty { text-align: center; padding: 48px 16px; color: var(--ink2); background: var(--surface); border: 1px dashed #cfd6e8; border-radius: 16px; }
  .empty b { display: block; font: 800 20px var(--display); color: var(--ink); margin-bottom: 4px; }

  /* ---------- calendar ---------- */
  .cal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-h h2 { margin: 0; font: 800 22px var(--display); letter-spacing: -.02em; min-width: 170px; }
  .iconb { appearance: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
  .iconb:hover { border-color: #b8c3e6; background: #f8f9ff; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .cal .wh { padding: 9px 10px; font-size: 12px; font-weight: 700; color: var(--ink3); background: #fafbfe; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .06em; }
  .cell { appearance: none; text-align: left; min-height: 104px; padding: 8px; border: 0; border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cell:nth-child(7n) { border-right: 0; }
  .cell:hover { background: #fafbff; }
  .cell.out { background: #fafbfd; color: var(--ink3); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--brand); background: #f6f7ff; }
  .cell .dn { font: 700 13px var(--display); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
  .cell.today .dn { background: var(--brand); color: #fff; }
  .cchip { display: block; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cchip.call { background: var(--brand-t); color: var(--brand-d); }
  .cchip.res { background: var(--amber-t); color: var(--amber-d); }
  .cmore { font-size: 11.5px; color: var(--ink3); padding-left: 4px; }
  .cnts { display: none; gap: 4px; }
  .cnts i { font-style: normal; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; }
  .cnts .a { background: var(--brand-t); color: var(--brand-d); } .cnts .b { background: var(--amber-t); color: var(--amber-d); }

  /* ---------- companies table ---------- */
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 14px; }

      (secs.length > 8 ? '<button class="link" data-secall="1" style="margin-top:6px">' + (S.secAll ? 'Show fewer' : '+ View ' + (secs.length - 8) + ' more') + '</button>' : '') + '</div>';
  }
  h += '<div class="sec"><h4>Watchlist</h4>' + ck('radio', 'mine', 'all', 'All companies', COMPS.length || null, '', !S.mine) + ck('radio', 'mine', 'mine', 'My companies', MINE.size, '', S.mine) +
    '<div class="tiny" style="margin-top:4px">Tap the star on any company. Saved in this browser only.</div></div>';
  if (t === 'concalls') {
    h += '<div class="sec"><h4>Concall details</h4>' + ck('checkbox', 'dial', '1', 'Has dial-in link', null, '', S.dial) + ck('checkbox', 'post', '1', 'Post-call filing available', null, '', S.post) + '</div>';
  }
  if (t === 'calendar') {
    h += '<div class="sec"><h4>Show</h4>' + ck('checkbox', 'showCalls', '1', 'Concalls', null, '<span class="dot" style="--s:var(--brand)"></span>', S.showCalls) + ck('checkbox', 'showRes', '1', 'Results', null, '<span class="dot" style="--s:var(--amber)"></span>', S.showRes) + '</div>';
  }
  if (t === 'companies') {
    h += '<div class="sec"><h4>Coverage</h4>' + ck('radio', 'cov', 'all', 'All companies', null, '', S.cov === 'all') + ck('radio', 'cov', 'has', 'Has a date', null, '', S.cov === 'has') + ck('radio', 'cov', 'none', 'No date yet', null, '', S.cov === 'none') + '</div>';
  }
  $('side').innerHTML = h + '<button class="btn primary sd-done" id="filtdone">Show results</button>';
}
function renderMain() {
  var h;
  switch (S.tab) {
    case 'overview': h = renderOverview(); break;
    case 'concalls': h = renderList('concall'); break;
    case 'results': h = renderList('result'); break;
    case 'calendar': h = renderCalendar(); break;
    case 'companies': h = banner() + renderCompanies(); break;
    default: h = renderUpdates();
  }
  $('main').innerHTML = h;
  document.querySelectorAll('.bar .tr i').forEach(function (el) { requestAnimationFrame(function () { el.style.width = el.getAttribute('data-w') + '%'; }); });
}
function renderAll() { renderNav(); renderTop(); renderSide(); renderMain(); }

// ------------------------------------------------------------ events
document.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('#nav button'))) { S.tab = b.dataset.tab; S.q = S.tab === 'overview' ? '' : S.q; autoRange(); closeDrawer(); renderAll(); window.scrollTo(0, 0); return; }
  if ((b = t.closest('[data-preset]'))) { S.preset = b.dataset.preset; S.auto[S.tab] = true; renderTop(); renderMain(); return; }
  if ((b = t.closest('[data-day]'))) { S.day = b.dataset.day; renderMain(); return; }
  if ((b = t.closest('[data-cal]'))) { S.selDay = b.dataset.cal; if (S.selDay.slice(0, 7) !== S.month) S.month = S.selDay.slice(0, 7); renderMain(); return; }
  if ((b = t.closest('[data-mon]'))) {
    var d = +b.dataset.mon;
    if (d === 0) { S.month = TODAY.slice(0, 7); S.selDay = TODAY; }
    else { var y = +S.month.slice(0, 4), m = +S.month.slice(5, 7) + d; var nd = new Date(Date.UTC(y, m - 1, 1)); S.month = nd.toISOString().slice(0, 7); S.selDay = ''; }
    renderMain(); return;
  }
  if ((b = t.closest('[data-star]'))) {
    var sym = b.dataset.star; if (MINE.has(sym)) MINE.delete(sym); else MINE.add(sym);
    lsSet('n200.mine', JSON.stringify(Array.from(MINE)));
    renderSide(); renderMain(); return;
  }
  if ((b = t.closest('[data-rm]'))) {
    var k = b.dataset.rm, v = b.dataset.v;
    if (k === 'group') S.groups = S.groups.filter(function (x) { return x !== v; });
    else if (k === 'sector') S.sectors = S.sectors.filter(function (x) { return x !== v; });
    else if (k === 'mine') S.mine = false; else if (k === 'dial') S.dial = false; else if (k === 'post') S.post = false; else if (k === 'cov') S.cov = 'all';
    renderTop(); renderSide(); renderMain(); return;
  }
  if (t.closest('[data-clear]')) { clearFilters(); renderTop(); renderSide(); renderMain(); return; }
  if (t.closest('[data-secall]')) { S.secAll = !S.secAll; renderSide(); return; }
  if (t.closest('#filtbtn')) { document.body.classList.add('drawer'); return; }
  if (t.closest('#filtdone')) { closeDrawer(); return; }
  if (t.closest('#scrim')) { closeDrawer(); return; }
  if (t.closest('#icalbtn')) {
    var f = $('ical'); f.value = 'https://calendar.google.com/calendar/ical/' + encodeURIComponent(D.calId) + '/public/basic.ics';
    f.style.display = 'block'; f.focus(); f.select(); return;
  }
});
function syncClear() {
  var head = document.querySelector('#side .sd-head'); if (!head) return;
  var b = head.querySelector('[data-clear]'), n = activeFilters().length;
  if (n && !b) head.insertAdjacentHTML('beforeend', '<button class="link" data-clear="1">Clear all</button>');
  else if (!n && b) b.remove();
}
function closeDrawer() { document.body.classList.remove('drawer'); }
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeDrawer(); });
document.addEventListener('change', function (ev) {
  var el = ev.target, f = el.dataset && el.dataset.f;
  if (f) {
    if (f === 'group' || f === 'sector') {
      var key = f === 'group' ? 'groups' : 'sectors', i = S[key].indexOf(el.value);
      if (el.checked && i < 0) S[key].push(el.value); else if (!el.checked && i >= 0) S[key].splice(i, 1);
    } else if (f === 'mine') S.mine = el.value === 'mine';
    else if (f === 'cov') S.cov = el.value;
    else S[f] = el.checked;
    renderTop(); renderMain(); syncClear(); return;
  }
  if (el.id === 'dfrom' || el.id === 'dto') {
    S.preset = 'custom'; S.from = $('dfrom').value; S.to = $('dto').value; S.auto[S.tab] = true;
    renderTop(); renderMain();
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'q') { S.q = el.value; renderMain(); }
  else if (el.matches && el.matches('.subf input[type=email]')) S.email = el.value;
});
document.addEventListener('submit', function (ev) {
  if (!ev.target.closest('.subf')) return;
  ev.preventDefault();
  var email = (S.email || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { S.sub = { state: 'err', msg: 'Please enter a valid email address.' }; renderMain(); return; }
  if (!hasGAS()) { S.sub = { state: 'err', msg: 'Subscribing works from the live tracker link, not from a saved copy of this page.' }; renderMain(); return; }
  S.sub = { state: 'busy', msg: 'Sending the confirmation mail...' }; renderMain();
  google.script.run
    .withSuccessHandler(function (r) {
      S.sub = { state: r && r.ok ? 'ok' : 'err', msg: (r && r.msg) || 'Something went wrong. Please try again.' };
      if (r && r.ok) lsSet('n200.email', email);
      renderMain();
    })
    .withFailureHandler(function () { S.sub = { state: 'err', msg: 'Could not reach the tracker. Please try again in a minute.' }; renderMain(); })
    .subscribeEmail(email);
});

// ------------------------------------------------------------ first view + live updates
function autoRange() {
  if ((S.tab !== 'concalls' && S.tab !== 'results') || S.auto[S.tab]) return;
  S.auto[S.tab] = true;
  var kind = S.tab === 'concalls' ? 'concall' : 'result';
  var has = function () { return listEntries(kind).length > 0; };
  if (!has()) S.preset = '30';
  if (!has()) S.preset = 'all';
}
$('checked').textContent = D.checked ? 'Updated ' + D.checked + ' IST' : 'Waiting for the first check';
if (D.checked) $('fresh').classList.remove('none');
$('cta').innerHTML = calendarBtns();
renderAll();

setInterval(function () {
  var t = istToday();
  if (t !== TODAY) { TODAY = t; S.day = ''; S.month = TODAY.slice(0, 7); S.selDay = ''; if (!document.activeElement || document.activeElement.tagName !== 'INPUT') renderAll(); return; }
  document.querySelectorAll('.cd[data-date]').forEach(function (el) {
    var s = status(el.dataset.date, el.dataset.time);
    if (s) { el.className = 'cd ' + s.c; el.textContent = s.t; }
  });
  var nl = $('nowline');
  if (nl) { var nm = nowMin(); nl.style.left = (Math.min(Math.max(nm, 480), 1260) - 480) / 780 * 100 + '%'; nl.firstChild.textContent = hhmm(nm); }
}, 30000);
})();
</script>
